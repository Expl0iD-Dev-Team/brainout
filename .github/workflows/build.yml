# Builds the Android APK and the dedicated-server bundle from a clean checkout.
#
#   push / pull request -> workflow artifacts (kept for 14 days)
#   tag v*              -> draft GitHub Release with the same files. The
#                          repository is public and the APK carries the
#                          server address, so the owner decides whether to
#                          publish it (docs/Release.md).
#
# Repository settings it reads (see docs/ReleasePlan.md):
#   secrets.ANDROID_KEYSTORE_BASE64, secrets.ANDROID_KEYSTORE_PASSWORD
#       release signing, created by scripts/setup-release-signing.sh. Without them
#       untagged builds fall back to a debug-signed APK; tagged builds fail.
#   vars.BRAINOUT_ENV_SERVICE
#       backend URL, e.g. https://203.0.113.10:19503. Without it the APK is the
#       offline / direct-connect build.
#   vars.BRAINOUT_SERVER_CA
#       PEM of the backend's private CA (deploy/anthill/state/tls/ca.crt); the
#       APK trusts it in addition to the system CAs.
name: Build

on:
  push:
    branches: [master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release on tags
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ENV_SERVICE: ${{ vars.BRAINOUT_ENV_SERVICE }}
      SERVER_CA: ${{ vars.BRAINOUT_SERVER_CA }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # scripts.py imports distutils, which is gone from Python 3.12.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install data build dependencies
        run: pip install PyCryptodome cffi git+https://github.com/desertkun/hjson-py

      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build data packages and the server
        run: ./gradlew make_data server:dist -PdataPython="$(which python)" --no-daemon --console=plain

      - name: Restore the signing key
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]]; then
            base64 -d <<< "$KEYSTORE_BASE64" > android/brainout-release.jks
            {
              echo "storeFile=brainout-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=brainout"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > android/keystore.properties
            echo "APK_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_DIR=release" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tagged builds must be signed: run scripts/setup-release-signing.sh"
            exit 1
          else
            echo "::warning::No signing key: building a debug-signed APK"
            echo "APK_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_DIR=debug" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        run: |
          args=(
            ":android:$APK_TASK" -PwithAndroid
            -PbrainoutVersionCode="$GITHUB_RUN_NUMBER"
            -PbrainoutVersionName="$VERSION"
            --no-daemon --console=plain
          )
          if [[ -n "$ENV_SERVICE" ]]; then
            args+=(-PbrainoutOnline=true -PbrainoutEnvService="$ENV_SERVICE")
          fi
          if [[ -n "$SERVER_CA" ]]; then
            printf '%s\n' "$SERVER_CA" > "$RUNNER_TEMP/server-ca.crt"
            args+=(-PbrainoutServerCa="$RUNNER_TEMP/server-ca.crt")
          elif [[ "$ENV_SERVICE" == https://* ]]; then
            echo "::warning::BRAINOUT_SERVER_CA is not set: the APK only trusts public CAs"
          fi
          ./gradlew "${args[@]}"

      - name: Collect the build
        run: |
          mkdir dist
          cp "android/build/outputs/apk/$APK_DIR/android-$APK_DIR.apk" "dist/brainout-$VERSION.apk"
          tar -czf "dist/brainout-server-$VERSION.tar.gz" -C bin server
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: brainout-${{ env.VERSION }}
          path: dist/
          retention-days: 14
          compression-level: 0

      - name: Create a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes" ]]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "BrainOut $VERSION" "$@"
